name: IDPhotoMaker
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Release

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 11.13.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.idphotomaker
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  IDPhotoMaker:
    type: application
    platform: iOS
    sources: [IDPhotoMaker]
    info:
      path: IDPhotoMaker/Info.plist
      properties:
        CFBundleName: "かんたん証明写真"
        CFBundleDisplayName: "かんたん証明写真"
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "証明写真を撮影するためにカメラを使用します"
        NSPhotoLibraryUsageDescription: "写真ライブラリから画像を選択するために使用します"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        GADApplicationIdentifier: "ca-app-pub-9404799280370656~1664371422"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: 5a6flpkh64.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.idphotomaker
        INFOPLIST_FILE: IDPhotoMaker/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 83VGKGSQUH
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "arm64 x86_64"
    dependencies:
      - package: GoogleMobileAds
